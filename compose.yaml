services:
  floci:
    image: floci/floci
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  sdk-demo:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./sdk-demo:/app
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://floci:4566
      - QUEUE_URL=http://floci:4566/000000000000/tp13-demo
    command: sh -c "sleep 5 && npm install && npm start"
    depends_on:
      - floci
